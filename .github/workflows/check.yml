# main 以外のブランチに push されたら、テストとビルドだけを行う(公開はしない)
# 作業用ブランチの変更を、main に入れる前に確かめるため
name: テストとビルドの確認

on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run test

      - run: npm run build

      # 新しい版の情報(version.json)が、公開する中身に入っているか確かめる(SPEC.md 18.3)
      - run: node -e "const v=JSON.parse(require('fs').readFileSync('dist/version.json','utf8')); if(!Number.isSafeInteger(v.dbVersion)) process.exit(1); console.log(v)"

      # 公開先のパスがすべて /hitotsuyane/ になっていて、古い名前が残っていないか確かめる(SPEC.md 19.3)
      - run: |
          # 「! grep」は複数行の途中だと失敗にならないので、if で確かめる
          if grep -rl "/did-todo/" dist; then exit 1; fi
          grep -q '"start_url":"/hitotsuyane/"' dist/manifest.webmanifest
          grep -q '"scope":"/hitotsuyane/"' dist/manifest.webmanifest
          grep -q 'src="/hitotsuyane/' dist/index.html

      # 本番のビルドに、テスト版のデータベースの名前が入っていないか確かめる(SPEC.md 21章)
      - run: "! grep -rl 'hitotsuyane-test' dist"

      # テスト版のビルド(SPEC.md 21章)
      - run: npm run build:test

      # テスト版のビルドに、本番のデータベースの名前(did-todo)が1つもないこと(本番のデータに触れないこと)と、
      # 公開先・ホーム画面の名前がテスト版のものになっていることを確かめる
      - run: |
          if grep -rl "did-todo" dist-test; then exit 1; fi
          grep -q '"start_url":"/hitotsuyane-test/"' dist-test/manifest.webmanifest
          grep -q '"scope":"/hitotsuyane-test/"' dist-test/manifest.webmanifest
          grep -q '"short_name":"テストやね"' dist-test/manifest.webmanifest
          grep -q 'src="/hitotsuyane-test/' dist-test/index.html

      # ビルドした中身を、画面の確認用に残す(7日で消える)
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
